worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /app/static;

    # The client address: Caddy on the host reaches the published port over
    # the Docker bridge and appends the client to X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # /healthz and /api/share/: docker/entrypoint.sh picks them by whether
    # character sharing is on (share-enabled.conf.template, share-disabled.conf).
    include /tmp/nginx/share.conf;

    location = /runtime-config.json {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store";
      alias /app/runtime-config.json;
    }

    location /private-packs/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "private, max-age=31536000, immutable";
      alias /app/private-packs/;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
