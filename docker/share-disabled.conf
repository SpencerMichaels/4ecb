# Character sharing off (the default): docker/entrypoint.sh copies this to
# /tmp/nginx/share.conf and starts no relay.

location = /healthz {
  include /etc/nginx/security-headers.conf;
  access_log off;
  add_header Content-Type text/plain;
  return 200 "ok\n";
}

location ~ ^/api/share(/|$) {
  include /etc/nginx/security-headers.conf;
  access_log off;
  default_type application/json;
  add_header Cache-Control "no-store" always;
  return 503 '{"error":"disabled"}';
}
