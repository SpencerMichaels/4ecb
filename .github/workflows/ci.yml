name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: cachix/install-nix-action@v31
      - name: Run tests and deterministic fixture build
        # The print check runs in print-checks below.
        run: nix develop path:. --command bash scripts/check.sh
        env:
          FOURECB_SKIP_PRINT_CHECK: "1"

  # The browser print check (scripts/check-print.mjs), separate from public-checks
  # so its result doesn't gate publish-image: its golden layout values depend on
  # the fonts the machine resolves, and it is red on main pending a font-pinning
  # and golden review. It still runs and reports on every push.
  print-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: cachix/install-nix-action@v31
      - name: Build and run the print check
        run: nix develop path:. --command bash -c 'pnpm build && pnpm check:print'

  # Publishes the production image to ghcr.io for hosted deployments, only from
  # main and only after the public checks pass (not print-checks; see above). Tags: the full commit SHA and
  # `main`; deployments should pin the digest. The image never contains private
  # content (see docs/public-deployment.md).
  publish-image:
    needs: public-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The app shows the build's commit; Docker builds have no .git to read it
      # from (apps/web/vite.config.ts), so pass it in.
      - id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=main
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: FOURECB_COMMIT=${{ steps.commit.outputs.short }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
